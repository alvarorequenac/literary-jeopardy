<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tablero de Libros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
/* Layout: a library catalog drawer. Paper cards sit on a dark table, category headers are guide tabs,
   an opened clue becomes one big card with a timer strip, and the club logo lives on the cover card.
   Every color comes from five user-editable inputs (bg, paper, accent, ink, stamp); the script derives
   the rest and writes all of these tokens, so the defaults below only cover the first paint. */
:root{
  color-scheme:dark;
  --bg:#2a2519; --bg-2:#363022; --edge:#524930; --field:#1b1811; --veil:#14120cf5;
  --paper:#ebe3d0; --paper-2:#ddd3b9; --paper-line:#c9bd9b;
  --ink:#2c2417; --ink-soft:#6b5d44;
  --accent:#c29a3c; --accent-ink:#16120a; --accent-text:#c29a3c;
  --stamp:#9a3b24; --stamp-ink:#ffffff;
  --good:#5fa37a; --good-ink:#0d1f15;
  --text:#f1ead7; --muted:#b4a98c;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --type:'Special Elite','Courier New',monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{
  height:100%;margin:0;
  padding-block:12px;
  padding-inline:max(16px,1.4vw);
  background:var(--bg);color:var(--text);
  font:400 1rem/1.45 var(--serif);
  display:flex;flex-direction:column;overflow-x:hidden;
}
button,input,textarea,select{font:inherit}
#app{flex:1;min-height:0;display:flex;flex-direction:column}

/* buttons */
.btn{
  font:600 .95rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;
  padding:.6rem .85rem;min-height:2.5rem;
  border:1px solid var(--edge);border-radius:3px;
  background:var(--bg-2);color:var(--text);cursor:pointer;
}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn:disabled:hover{border-color:var(--edge)}
.btn.on,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.armed{background:var(--stamp);color:var(--stamp-ink);border-color:var(--stamp)}
.btn:focus-visible,.tile:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.card:focus-visible,.pal:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding-bottom:.6rem}
.brand{flex:1 1 14rem;min-width:0;display:flex;align-items:center;gap:.7rem}
.logo{
  flex:none;width:clamp(2.6rem,4.5vw,3.6rem);aspect-ratio:1;object-fit:cover;
  border-radius:.5rem;border:2px solid var(--accent);background:var(--paper);cursor:pointer;
}
.bar h1{
  min-width:0;margin:0;
  font:700 clamp(1.3rem,2.2vw + .6rem,2.4rem)/1 var(--display);
  letter-spacing:.08em;text-transform:uppercase;overflow-wrap:anywhere;text-wrap:balance;
}
.tools{display:flex;flex-wrap:wrap;gap:.4rem}

/* play stage */
.scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.stage{display:flex;flex-direction:column}
.note{margin:0;padding-bottom:.5rem;font:400 .9rem/1.3 var(--type);color:var(--muted)}
.board-wrap{flex:1 0 auto;display:flex;overflow-x:auto;padding-top:6px;min-width:0}
.board{
  flex:1;display:grid;gap:clamp(4px,.7vw,10px);
  grid-template-columns:repeat(var(--n),minmax(0,1fr));
  grid-template-rows:auto repeat(var(--r),minmax(2.8rem,1fr));
  min-width:calc(var(--n) * 4.5rem);
  min-height:calc(var(--r) * 3.4rem + 3.6rem);
}
.cat{
  position:relative;display:grid;place-items:center;text-align:center;
  min-height:3.4rem;padding:.5rem .35rem;border-radius:3px;
  background:var(--accent);color:var(--accent-ink);
  font:700 clamp(.78rem,1.1vw + .45rem,1.9rem)/1.05 var(--display);
  letter-spacing:.05em;text-transform:uppercase;overflow-wrap:anywhere;hyphens:auto;
}
.cat::before{content:"";position:absolute;top:-5px;left:12%;width:34%;height:5px;background:var(--accent);border-radius:3px 3px 0 0}
.tile{
  appearance:none;position:relative;display:grid;place-items:center;overflow:hidden;
  padding:8% 0 .4em;border:1px solid var(--paper-line);border-radius:3px;
  background:var(--paper);color:var(--ink);cursor:pointer;
  font:400 clamp(1.5rem,2.6vw + .7rem,4rem)/1 var(--type);
  box-shadow:0 2px 0 rgba(0,0,0,.35);
}
.tile::before{content:"";position:absolute;left:0;right:0;top:16%;height:1px;background:var(--stamp);opacity:.55}
.tile::after{
  content:"";position:absolute;left:50%;bottom:7%;width:clamp(6px,.9vw,12px);aspect-ratio:1;
  transform:translateX(-50%);border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.6);
}
.tile.used{background:transparent;border:1px dashed var(--edge);color:transparent;box-shadow:none;cursor:default}
.tile.used::before,.tile.used::after{display:none}
@media (prefers-reduced-motion:no-preference){
  .tile{transition:transform .12s ease,box-shadow .12s ease}
  .tile:not(.used):hover{transform:translateY(-3px);box-shadow:0 5px 0 rgba(0,0,0,.35)}
}

/* scoreboard */
.scores{flex:none;display:flex;flex-wrap:wrap;gap:.5rem;padding-top:.7rem}
.team{
  --tc:#999;flex:1 1 10rem;min-width:0;display:grid;gap:.15rem;padding:.45rem .6rem .5rem;
  background:var(--bg-2);border:1px solid var(--edge);border-left:4px solid var(--tc);border-radius:3px;
}
.team .nm{
  width:100%;min-width:0;padding:.15rem 0;border:0;background:transparent;color:var(--text);
  font:600 1rem/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase;
}
.team .row{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.team .pts{font:400 clamp(1.4rem,2vw + .7rem,2.6rem)/1 var(--type);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.team .step{min-height:2.2rem;padding:.4rem .7rem;font-size:1.1rem}

/* clue overlay */
#overlay{
  position:fixed;inset:0;z-index:20;display:flex;background:var(--veil);
  padding:max(12px,1.4vw);
  padding-top:max(12px,env(safe-area-inset-top,0px));
  padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
}
.card{
  width:100%;max-width:1500px;height:100%;margin:auto;position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:.8rem;padding:clamp(.8rem,2vw,2rem);
  background:var(--paper);color:var(--ink);border-radius:4px;
}
.card-head{
  display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;
  padding-bottom:.6rem;border-bottom:2px solid var(--stamp);
}
.ccat{
  padding:.3rem .8rem;border-radius:3px;background:var(--accent);color:var(--accent-ink);
  font:700 clamp(1.1rem,1.6vw + .6rem,2.2rem)/1.1 var(--display);letter-spacing:.07em;text-transform:uppercase;
}
.lvl{font:400 .95rem/1 var(--type);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.cval{margin-left:auto;font:400 clamp(1.4rem,2vw + .7rem,2.6rem)/1 var(--type)}
.wm{width:clamp(2.2rem,3.4vw,3rem);aspect-ratio:1;border-radius:4px;object-fit:cover;mix-blend-mode:multiply;opacity:.8}
.dbl{padding:.15rem .5rem;border:2px solid var(--stamp);color:var(--stamp);font:400 1.05rem/1.2 var(--type);text-transform:uppercase;transform:rotate(-3deg)}
.cbody{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.cin{margin-block:auto;display:grid;gap:1.2rem;padding:.4rem 0}
.q{margin:0;text-align:center;text-wrap:balance;overflow-wrap:anywhere;font:400 clamp(1.5rem,3.4vw + .5rem,4.2rem)/1.22 var(--serif)}
.srcnote{margin:0;text-align:center;font:400 .95rem/1.2 var(--type);color:var(--ink-soft)}
.ans{text-align:center;border-top:1px dashed var(--ink-soft);padding-top:1rem}
.ans .lab{font:400 .95rem/1 var(--type);letter-spacing:.15em;text-transform:uppercase;color:var(--stamp)}
.ans .a{margin:.4rem 0 0;font:600 clamp(1.4rem,2.8vw + .4rem,3.2rem)/1.2 var(--serif);overflow-wrap:anywhere}
.ans .n{margin:.6rem auto 0;max-width:60ch;color:var(--ink-soft);font:400 clamp(1rem,1vw + .7rem,1.5rem)/1.4 var(--serif)}
.timer{display:flex;align-items:center;gap:1rem}
.track{flex:1;height:.9rem;overflow:hidden;background:var(--paper-2);border:1px solid var(--paper-line);border-radius:2px}
.fill{height:100%;width:100%;background:var(--good)}
.timer.warn .fill{background:var(--accent)}
.timer.crit .fill{background:var(--stamp)}
.tnum{min-width:2.2ch;text-align:right;font:400 clamp(2rem,3vw + 1rem,3.6rem)/1 var(--type);font-variant-numeric:tabular-nums}
.timer.crit .tnum{color:var(--stamp)}
.tnote{font:400 1.1rem/1 var(--type);letter-spacing:.1em;text-transform:uppercase;color:var(--stamp)}
@media (prefers-reduced-motion:no-preference){
  .timer.crit .tnum{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.55}}
}
.ctrl,.award{display:flex;flex-wrap:wrap;gap:.5rem}
.card .btn{background:transparent;color:var(--ink);border-color:var(--ink-soft)}
.card .btn:hover{border-color:var(--ink)}
.card .btn.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card .btn.good{background:var(--good);color:var(--good-ink);border-color:var(--good)}
.card .btn.bad{background:var(--stamp);color:var(--stamp-ink);border-color:var(--stamp)}
.aw{
  --tc:#999;flex:1 1 15rem;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:.4rem .6rem;
  padding:.35rem .45rem .35rem .7rem;border:1px solid var(--paper-line);border-left:5px solid var(--tc);border-radius:3px;
}
.anm{flex:1 1 6rem;min-width:0;font:600 1.05rem/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase;overflow-wrap:anywhere}
.asc{font:400 1.3rem/1 var(--type);font-variant-numeric:tabular-nums}
.hint{margin:0;font:400 .8rem/1.3 var(--type);color:var(--ink-soft)}

/* cover: the logo on a catalog card */
#cover{
  position:fixed;inset:0;z-index:30;display:grid;place-items:center;overflow:auto;background:var(--veil);
  padding:16px;
  padding-top:max(16px,env(safe-area-inset-top,0px));
  padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
}
.cover-in{display:grid;gap:1.6rem;justify-items:center;margin-block:auto}
.fich{
  position:relative;width:min(88vw,19rem);padding:1rem 1rem 1.2rem;text-align:center;
  background:var(--paper);color:var(--ink);border-radius:5px;transform:rotate(-1.2deg);
  box-shadow:0 20px 50px rgba(0,0,0,.55),0 2px 0 var(--paper-line);
}
.fich::before{
  content:"";position:absolute;top:-.9rem;left:10%;width:38%;height:.9rem;
  background:var(--accent);border-radius:5px 5px 0 0;
}
.fich-logo{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px}
.fich-rule{height:2px;margin:1rem 0 .8rem;background:var(--stamp);opacity:.7}
.fich-title{margin:0;font:700 clamp(1.8rem,3vw + 1rem,2.8rem)/1 var(--display);letter-spacing:.08em;text-transform:uppercase;overflow-wrap:anywhere;text-wrap:balance}
.fich-sub{margin:.5rem 0 0;font:400 .95rem/1.3 var(--type);color:var(--ink-soft)}
.cover-act{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem}

/* sets and colors */
.subtabs,.cat-tabs{display:flex;flex-wrap:wrap;gap:.4rem}
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.8rem}
.set-card{display:flex;flex-direction:column;gap:.5rem;min-width:0;padding:.85rem;background:var(--bg);border:1px solid var(--edge);border-radius:3px}
.set-card h3{margin:0;color:var(--accent-text);font:700 1.3rem/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase;overflow-wrap:anywhere}
.set-card p{margin:0;color:var(--muted);font-size:.92rem}
.meta{font:400 .8rem/1.35 var(--type);color:var(--muted);overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:auto}
.saved{display:grid;gap:.5rem}
.saved-row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .8rem;padding:.6rem .7rem;background:var(--bg);border:1px solid var(--edge);border-radius:3px}
.saved-row .info{flex:1 1 12rem;min-width:0;display:grid;gap:.15rem}
.saved-row .nm{font:600 1.1rem/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase;overflow-wrap:anywhere}
.mix-grp{background:var(--bg);border:1px solid var(--edge);border-radius:3px}
.mix-grp summary{cursor:pointer;padding:.6rem .8rem;font:600 1.05rem/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase}
.mix-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.4rem .9rem;padding:.2rem .8rem .8rem}
.pal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.6rem}
.pal{display:grid;gap:.45rem;padding:.55rem;border:2px solid var(--edge);border-radius:3px;background:var(--bg);color:var(--text);cursor:pointer;text-align:left}
.pal.on{border-color:var(--accent)}
.pal-name{font:600 1rem/1 var(--display);letter-spacing:.07em;text-transform:uppercase}
.sw{display:flex;height:1.7rem;overflow:hidden;border-radius:2px;border:1px solid rgba(128,128,128,.45)}
.sw i{flex:1}
.pickers{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.8rem}
.pk{display:flex;align-items:center;gap:.6rem;min-width:0}
.pk span{min-width:0;font-size:.95rem}
input[type=color]{width:3.2rem;height:2.4rem;flex:none;padding:0;border:1px solid var(--edge);border-radius:3px;background:transparent;cursor:pointer}

/* editor */
.editor{padding-bottom:2rem}
.ed-in{max-width:68rem;margin:0 auto;display:grid;gap:1.2rem}
.ed-sec{display:grid;gap:.9rem;min-width:0;padding:1rem;background:var(--bg-2);border:1px solid var(--edge);border-radius:3px}
.ed-sec h2{margin:0;color:var(--accent-text);font:700 1.3rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.help{margin:0;color:var(--muted);font-size:.95rem}
.fld{display:grid;gap:.25rem;min-width:0}
.fld label,.lbl{font:400 .85rem/1.2 var(--type);letter-spacing:.04em;color:var(--muted)}
input[type=text],input[type=number],textarea,select{
  width:100%;min-width:0;padding:.5rem .6rem;
  background:var(--field);color:var(--text);border:1px solid var(--edge);border-radius:3px;
  font:400 1rem/1.4 var(--serif);
}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:.8rem}
.stack{display:grid;gap:.5rem}
.rowline{display:flex;align-items:center;gap:.5rem;min-width:0}
.rowline.wrap{flex-wrap:wrap}
.vals{display:flex;flex-wrap:wrap;gap:.6rem}
.vals .fld{width:6.5rem}
.ced{display:grid;grid-template-columns:5rem minmax(0,1fr);gap:.6rem;padding:.7rem;background:var(--bg);border:1px solid var(--edge);border-radius:3px}
.ced-v{font:400 1.6rem/1.2 var(--type);color:var(--accent-text)}
.ced-f{display:grid;gap:.5rem;min-width:0}
.chk{display:flex;align-items:center;gap:.5rem;font-size:.95rem;min-width:0}
input[type=checkbox]{width:1.1rem;height:1.1rem;flex:none;accent-color:var(--accent)}
input[type=file]{max-width:100%;color:var(--muted)}
@media (max-width:40rem){
  .ced{grid-template-columns:minmax(0,1fr)}
  .btn{padding:.5rem .6rem;min-height:2.2rem;font-size:.85rem;letter-spacing:.05em}
  .bar{gap:.4rem .6rem}
  .tools{gap:.3rem}
  .cat{padding:.4rem .2rem;font-size:.66rem;letter-spacing:.02em}
  .tile{font-size:1.25rem}
}

#toast{
  position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;
  max-width:calc(100% - 32px);padding:.55rem .9rem;border-radius:3px;
  background:var(--paper);color:var(--ink);font:400 .95rem/1.3 var(--type);box-shadow:0 6px 24px rgba(0,0,0,.5);
}

</style>

<div id="app"></div>
<div id="cover" hidden></div>
<div id="overlay" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* Sets incluidos. Cada categoría tiene 5 preguntas: 2 fáciles, 1 media y 2 difíciles (en ese orden).
   Formato de pregunta: [pregunta, respuesta, dato extra]. dbl = [categoría, fila] de la pregunta doble. */
var BUILTIN=[
{id:'clasicos',name:'Clásicos del club',desc:'Novelas clásicas, frases famosas, parejas literarias, autores y mundos de ficción.',dbl:[2,4],cats:[
 ['Clásicos universales',[
  ["¿Quién es el autor de «Don Quijote de la Mancha»?","Miguel de Cervantes","La primera parte apareció en 1605 y la segunda en 1615."],
  ["¿Cómo se llama la ballena blanca que persigue el capitán Ahab?","Moby Dick","Novela de Herman Melville, publicada en 1851."],
  ["¿Qué novela de Dostoievski sigue a Raskólnikov, un estudiante que comete un asesinato?","Crimen y castigo","Se publicó por entregas en 1866."],
  ["¿Qué novela de Tolstói tiene como protagonista a una mujer casada que se enamora del conde Vronski?","Ana Karénina","Se publicó por entregas entre 1875 y 1877."],
  ["¿Quién escribió «En busca del tiempo perdido»?","Marcel Proust","Son siete volúmenes, publicados entre 1913 y 1927."]]],
 ['¿Quién dijo esto?',[
  ["¿Quién dice «Ser o no ser, esa es la cuestión»?","Hamlet","Obra de William Shakespeare."],
  ["Un zorro le dice a un niño «Lo esencial es invisible a los ojos». ¿Cómo se llama el niño?","El Principito","Antoine de Saint-Exupéry, 1943."],
  ["«Es una verdad universalmente reconocida que un hombre soltero, poseedor de una gran fortuna, necesita una esposa». ¿Qué novela abre así?","Orgullo y prejuicio","Jane Austen, 1813."],
  ["«Todos los animales son iguales, pero algunos animales son más iguales que otros». ¿De qué libro viene?","Rebelión en la granja","George Orwell, 1945."],
  ["¿Quién escribió «Yo soy yo y mi circunstancia»?","José Ortega y Gasset","Aparece en «Meditaciones del Quijote» (1914)."]]],
 ['Parejas de libros',[
  ["Romeo y…","Julieta","Tragedia de Shakespeare."],
  ["Don Quijote y…","Sancho Panza"],
  ["Elizabeth Bennet y…","Fitzwilliam Darcy","Protagonistas de «Orgullo y prejuicio»."],
  ["Winston Smith y…","Julia","Personajes de «1984», de George Orwell."],
  ["Heathcliff y…","Catherine Earnshaw","Personajes de «Cumbres borrascosas», de Emily Brontë."]]],
 ['Autores y obras',[
  ["¿Quién escribió «Los miserables»?","Victor Hugo","Publicada en 1862."],
  ["¿Quién escribió «Mujercitas»?","Louisa May Alcott","La primera parte salió en 1868."],
  ["¿Quién escribió «Madame Bovary»?","Gustave Flaubert","Publicada en 1857."],
  ["¿Quién escribió «El Aleph»?","Jorge Luis Borges","Libro de cuentos de 1949."],
  ["¿Qué seudónimo masculino usó Mary Ann Evans para publicar «Middlemarch»?","George Eliot","Se publicó entre 1871 y 1872."]]],
 ['Mundos y lugares',[
  ["¿Cómo se llama el pueblo de «Cien años de soledad»?","Macondo","Novela de Gabriel García Márquez."],
  ["¿Cómo se llama el país mágico al que se llega por un armario en la obra de C. S. Lewis?","Narnia"],
  ["¿Cómo se llama el asteroide de donde viene El Principito?","B-612"],
  ["¿Cómo se llama el condado ficticio de Mississippi creado por William Faulkner?","Yoknapatawpha","Ahí transcurren «El ruido y la furia» y «Mientras agonizo»."],
  ["¿Cómo se llama la ciudad imaginaria de «La Regenta»?","Vetusta","Novela de Leopoldo Alas «Clarín», de 1884 y 1885."]]]
]},
{id:'latam',name:'Latinoamérica y Chile',desc:'El Boom, letras chilenas, premios Nobel y poesía del continente.',dbl:[3,4],cats:[
 ['El Boom',[
  ["¿Qué colombiano escribió «Crónica de una muerte anunciada»?","Gabriel García Márquez","Se publicó en 1981."],
  ["¿Qué argentino escribió «Rayuela»?","Julio Cortázar","Publicada en 1963."],
  ["¿Qué peruano escribió «La ciudad y los perros»?","Mario Vargas Llosa","Su primera novela, de 1963."],
  ["¿Qué mexicano escribió «La muerte de Artemio Cruz»?","Carlos Fuentes","Publicada en 1962."],
  ["¿Qué chileno del Boom escribió «El obsceno pájaro de la noche»?","José Donoso","Publicada en 1970."]]],

function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ---------- colores y temas ---------- */
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');var n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];}
function rgb2hex(a){return '#'+a.map(function(v){v=Math.max(0,Math.min(255,Math.round(v)));return (v<16?'0':'')+v.toString(16);}).join('');}
function mix(a,b,t){var x=hex2rgb(a),y=hex2rgb(b);return rgb2hex([0,1,2].map(function(i){return x[i]+(y[i]-x[i])*t;}));}
function lum(h){var c=hex2rgb(h).map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];}
function contrast(a,b){var l1=lum(a),l2=lum(b);if(l1<l2){var t=l1;l1=l2;l2=t;}return (l1+0.05)/(l2+0.05);}
function onColor(bg,c1,c2){return contrast(bg,c1)>=contrast(bg,c2)?c1:c2;}

function presetById(id){for(var i=0;i<PRESETS.length;i++)if(PRESETS[i].id===id)return PRESETS[i];return PRESETS[0];}
var HEX=/^#[0-9a-fA-F]{6}$/;
function validColors(c){return c&&THEME_KEYS.every(function(k){return HEX.test(c[k[0]]);});}
function loadTheme(){
  var raw=readJSON(THKEY);
  var t={id:'conco',custom:Object.assign({},PRESETS[0].c)};
  if(raw){
    if(validColors(raw.custom))t.custom=raw.custom;
    if(raw.id==='custom'||PRESETS.some(function(p){return p.id===raw.id;}))t.id=raw.id;
  }

}

function derive(c){
  var dark=lum(c.bg)<0.25;
  var text=dark?mix(c.paper,'#ffffff',0.3):mix(c.ink,'#000000',0.25);
  var bg2=dark?mix(c.bg,'#ffffff',0.07):mix(c.bg,'#000000',0.06);

    '--bg':c.bg,'--paper':c.paper,'--accent':c.accent,'--ink':c.ink,'--stamp':c.stamp,
    '--bg-2':bg2,
    '--edge':dark?mix(c.bg,'#ffffff',0.2):mix(c.bg,'#000000',0.2),
    '--field':dark?mix(c.bg,'#000000',0.35):mix(c.bg,'#ffffff',0.55),

/* ---------- normalización ---------- */
function normClue(x,j,rows){
  x=x||{};var l=Number(x.l);
  return {q:str(x.q,600),a:str(x.a,300),n:str(x.n,400),d:!!x.d,
    l:(l>=1&&l<=3)?Math.round(l):levelForRow(j,rows),used:!!x.used,src:str(x.src,80)};
}
function normCore(o){
  var cats=Array.isArray(o&&o.cats)?o.cats.slice(0,MAX_CATS):[];
  if(!cats.length)throw new Error('sin categorías');
  var vals=Array.isArray(o.vals)?o.vals.slice(0,MAX_ROWS).map(function(v){return num(v,100,1,100000);}):[];
  if(!vals.length)vals=defaultVals(5);
  return {vals:vals,cats:cats.map(function(c,i){
    var cl=Array.isArray(c&&c.clues)?c.clues:[];
    return {name:str(c&&c.name,60)||('Categoría '+(i+1)),
      clues:vals.map(function(_,j){return normClue(cl[j],j,vals.length);})};
  })};
}
function normBoard(o){
  var core=normCore(o);
  var teams=(Array.isArray(o.teams)?o.teams.slice(0,MAX_TEAMS):[]).map(function(t,i){
    return {name:str(t&&t.name,30)||('Equipo '+(i+1)),score:num(t&&t.score,0,-10000000,10000000)};
  });
  if(!teams.length)teams=[{name:'Equipo 1',score:0},{name:'Equipo 2',score:0}];
  return {title:str(o.title,80)||'Tablero de libros',timer:num(o.timer,30,5,600),sound:o.sound!==false,
    setName:str(o.setName,60),vals:core.vals,cats:core.cats,teams:teams};
}
function normSet(o,i){
  var core=normCore(o);
  return {id:str(o.id,24)||uid(),name:str(o.name||o.title,60)||('Set '+(i+1)),desc:str(o.desc,160),vals:core.vals,cats:core.cats};
}
function cloneCats(cats,keepUsed){
  return cats.map(function(c){
    return {name:c.name,clues:c.clues.map(function(x){
      return {q:x.q,a:x.a,n:x.n,d:x.d,l:x.l,src:x.src||'',used:keepUsed?!!x.used:false};
    })};

/* ---------- pool, sorteo y mezcla ---------- */
function allSets(withSaved){return withSaved?SETS.concat(LIB.sets):SETS;}
function normQ(s){return s.toLowerCase().replace(/\s+/g,' ').trim();}
function buildPool(withSaved){
  var seen={},clues=[],cats=[];
  allSets(withSaved).forEach(function(s){
    s.cats.forEach(function(c){
      var list=[];
      c.clues.forEach(function(x){
        if(!x.q.trim()||!x.a.trim())return;
        var k=normQ(x.q);if(seen[k])return;seen[k]=1;
        var item={q:x.q,a:x.a,n:x.n,d:x.d,l:x.l,cat:c.name,set:s.name};
        list.push(item);clues.push(item);
      });
      if(list.length)cats.push({name:c.name,set:s.name,clues:list});
    });
  });
  return {clues:clues,cats:cats};
}
function targetLevel(r,rows,diff){
  if(diff==='any')return 0;
  if(diff==='prog')return levelForRow(r,rows);
  return Number(diff);
}
function closest(list,target){
  if(!list.length)return null;
  if(!target)return list[Math.floor(Math.random()*list.length)];
  var best=9,arr=[];
  list.forEach(function(x){
    var d=Math.abs(x.l-target);
    if(d<best){best=d;arr=[x];}else if(d===best)arr.push(x);
  });
  return arr[Math.floor(Math.random()*arr.length)];
}
function toClue(x,src){
  if(!x)return blankClue(2);
  return {q:x.q,a:x.a,n:x.n,d:false,l:x.l,used:false,src:src||''};
}
var DIFF_LABEL={prog:'progresiva',1:'fácil',2:'media',3:'difícil',any:'al azar'};
function genRandom(o){
  var P=buildPool(o.saved),rows=o.rows,n=o.cols,cats=[],short=false;
  if(o.style!=='mix'){
    var mx=0;P.cats.forEach(function(c){mx=Math.max(mx,c.clues.length);});
    if(rows>mx)rows=mx;
  }
  var targets=[];for(var r=0;r<rows;r++)targets.push(targetLevel(r,rows,o.diff));
  var order=targets.map(function(t,i){return i;}).sort(function(a,b){return targets[b]-targets[a];});
  if(o.style==='mix'){
    var taken={};
    for(var c=0;c<n;c++){
      var col=new Array(rows);
      order.forEach(function(ri){
        var cand=P.clues.filter(function(x){return !taken[x.q];});
        var pick=closest(cand,targets[ri]);
        if(pick){taken[pick.q]=1;col[ri]=toClue(pick,pick.cat);}else col[ri]=blankClue(2);
      });
      cats.push({name:'Sorpresa '+(c+1),clues:col});
    }
  }else{
    var names={},chosen=[];
    shuffle(P.cats.filter(function(c){return c.clues.length>=rows;})).forEach(function(c){
      if(chosen.length<n&&!names[c.name]){names[c.name]=1;chosen.push(c);}
    });
    if(chosen.length<n)short=true;
    chosen.forEach(function(c){
      var left=c.clues.slice(),col=new Array(rows);
      order.forEach(function(ri){
        var pick=closest(left,targets[ri]);
        left.splice(left.indexOf(pick),1);col[ri]=toClue(pick,'');
      });
      cats.push({name:c.name,clues:col});
    });
  }
  if(cats.length>=3&&rows>=3){
    var cc=cats[Math.floor(Math.random()*cats.length)];
    cc.clues[rows-1].d=true;
  }
  return {title:'Tablero al azar',vals:defaultVals(rows),cats:cats,
    setName:'Al azar, dificultad '+DIFF_LABEL[o.diff],short:short};
}
function catList(){
  var out=[];
  allSets(true).forEach(function(s){
    s.cats.forEach(function(c,ci){out.push({key:s.id+':'+ci,set:s.name,setId:s.id,name:c.name,clues:c.clues,vals:s.vals});});
  });
  return out;
}
function buildMix(keys){
  var list=catList(),picked=[];
  keys.forEach(function(k){for(var i=0;i<list.length;i++)if(list[i].key===k){picked.push(list[i]);break;}});
  if(!picked.length)return null;
  var rows=0;picked.forEach(function(p){rows=Math.max(rows,p.clues.length);});
  var vals=picked[0].vals.length===rows?picked[0].vals.slice():defaultVals(rows);
  var cats=picked.map(function(p){
    var clues=[];
    for(var j=0;j<rows;j++){
      var x=p.clues[j];
      clues.push(x?{q:x.q,a:x.a,n:x.n,d:x.d,l:x.l,src:'',used:false}:blankClue(levelForRow(j,rows)));
    }
    return {name:p.name,clues:clues};
  });
  return {title:'Mezcla de categorías',vals:vals,cats:cats,setName:'Mezcla'};
}

function append(e,c){
  if(c==null||c===false)return;
  if(Array.isArray(c)){c.forEach(function(x){append(e,x);});return;}
  e.append(c.nodeType?c:document.createTextNode(String(c)));
}
function h(tag,props){
  var e=document.createElement(tag);
  if(props){
    for(var k in props){
      var v=props[k];
      if(v===false||v==null)continue;
      if(k==='class')e.className=v;
      else if(k==='text')e.textContent=v;
      else if(k==='value')e.value=v;
      else if(k==='checked')e.checked=!!v;
      else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
      else e.setAttribute(k,v===true?'':v);
    }
  }
  for(var i=2;i<arguments.length;i++)append(e,arguments[i]);
  return e;
}
function act(fn){
  return function(e){fn(e);if(e&&e.detail&&e.currentTarget&&e.currentTarget.blur)e.currentTarget.blur();};

var ac=null;
function ensureAudio(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}
}
function beep(){
  if(!S.sound)return;
  try{
    ensureAudio();
    [0,0.25,0.5].forEach(function(d,i){
      var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+d;
      o.type='square';o.frequency.value=i===2?660:880;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.15,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.22);
    });
  }catch(e){}
}

}

}

/* ---------- archivos ---------- */
function setToFile(name,desc,vals,cats){
  return {kind:'tablero-set',v:2,name:name,desc:desc||'',vals:vals.slice(),
    cats:cats.map(function(c){
      return {name:c.name,clues:c.clues.map(function(x){
        return {q:x.q,a:x.a,n:x.n,d:x.d,l:x.l,src:x.src||undefined};
      })};
    })};
}
function saveJSON(name,obj){
  if(!DL){toast('Guardar archivos no está disponible aquí. Usa «Copiar código».');return;}
  DL.save({filename:slug(name)+'.json',data:JSON.stringify(obj,null,1)})
    .then(function(){toast('Archivo guardado.');})
    .catch(function(e){if(e&&e.code==='declined')return;toast('No se pudo guardar el archivo. Prueba con «Copiar código».');});
}
function copyText(txt){
  var ta=$('io-text');
  var fb=function(){if(ta){ta.value=txt;ta.focus();ta.select();}toast('Selecciona el texto y cópialo con Ctrl+C.');};
  try{navigator.clipboard.writeText(txt).then(function(){toast('Código copiado.');}).catch(fb);}catch(e){fb();}
}
function upsertSet(set){
  var low=set.name.toLowerCase(),found=-1;
  LIB.sets.forEach(function(s,i){if(s.name.toLowerCase()===low)found=i;});
  if(found>=0){set.id=LIB.sets[found].id;LIB.sets[found]=set;return 'update';}
  if(LIB.sets.length>=MAX_SAVED)return 'full';
  LIB.sets.push(set);return 'add';
}
function importText(txt){
  try{
    var o=JSON.parse(txt);
    var list=(o&&Array.isArray(o.sets))?o.sets.slice(0,50):[o];
    var added=0;
    list.forEach(function(x,i){
      var s=normSet(x,i);s.id=uid();
      var r=upsertSet(s);if(r!=='full')added++;
    });
    saveLib();render();
    toast(added===1?'Set agregado a Mis sets.':added+' sets agregados a Mis sets.');
  }catch(e){toast('Ese contenido no parece un set válido.');}
}

/* ---------- teclado ---------- */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(open){closeClue();e.preventDefault();}
    else if(!cover.hidden){hideCover(false);e.preventDefault();}
    return;
  }
  var tag=(e.target&&e.target.tagName)||'';
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag)||(e.target&&e.target.isContentEditable))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var k=(e.key||'').toLowerCase();
  if(k==='f'&&cover.hidden){toggleFS();e.preventDefault();return;}
  if(!open)return;
  if((k===' '||k==='enter')&&tag!=='BUTTON'){toggleReveal();e.preventDefault();return;}
  if(k==='t'){tmToggle();e.preventDefault();return;}
  if(k==='r'){tmReset();e.preventDefault();return;}
  var m=/^Digit([1-6])$/.exec(e.code||'');
  if(m){giveTo(+m[1]-1,e.shiftKey?-1:1);e.preventDefault();}
});
